[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tailsafe"
dynamic = ["version"]
description = "Tail-risk evacuation stress-testing for high-rise Hong Kong buildings"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numba>=0.59",
    "typer>=0.12",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "httpx2; python_version >= '3.11'",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
tailsafe = "tailsafe.cli:app"

[tool.hatch.version]
path = "tailsafe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tailsafe"]

[tool.hatch.build.targets.wheel.force-include]
"config/params.yaml" = "tailsafe/_data/params.yaml"
"schemas" = "tailsafe/_data/schemas"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "D1",   # missing docstrings on public objects
]
ignore = [
    "D105",   # magic methods
    "D107",   # __init__ (documented on the class)
    "RUF001", # ambiguous unicode in strings (we use en dashes / subscripts on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.pep8-naming]
# Physics notation (N, M, dt, ...) is clearer than snake_case here.
ignore-names = ["N", "M", "K", "L", "W", "A", "C", "D", "Q", "V", "T", "X", "Y", "F*", "S*"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
packages = ["tailsafe"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "scipy", "scipy.*", "networkx", "networkx.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long-running tests (performance targets, large Monte Carlo); run with `make test-slow`",
]
filterwarnings = [
    "error::DeprecationWarning:tailsafe.*",
]

[tool.coverage.run]
source = ["tailsafe"]
