name: Browser version

# Builds the web UI as a static site with recorded results and deploys it to
# GitHub Pages, so anyone can use TailSafe from a browser on any device.
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Record results and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      # Simulation results are cached by the code and parameters that produce
      # them, so a change to the web UI alone redeploys in a few minutes.
      - name: Restore simulation cache
        uses: actions/cache@v4
        with:
          path: runs/site-cache
          key: site-${{ hashFiles('tailsafe/**/*.py', 'config/**', 'pyproject.toml') }}
          restore-keys: site-
      - name: Record the results
        env:
          TAILSAFE_CACHE_DIR: runs/site-cache
        run: tailsafe export-site --out web/public/data
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the static site
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci --no-audit --no-fund
          npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
